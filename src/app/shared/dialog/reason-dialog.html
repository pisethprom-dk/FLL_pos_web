<!-- v1.0.0 -->
<form (submit)="$event.preventDefault(); go()" novalidate>
  <div class="modal-head">
    <h3 id="reason-title">{{ data.title }}</h3>
    <div class="spacer"></div>
    <button type="button" class="modal-x" aria-label="Close" (click)="ref.close()">&times;</button>
  </div>
  <div class="form">
    <p class="confirm-message">{{ data.message }}</p>
    <div class="form-grid one" style="margin-top: 16px">
      <div class="field">
        <label for="reason-text">{{ data.label }}</label>
        <textarea
          id="reason-text"
          [formControl]="reason"
          [placeholder]="data.placeholder ?? ''"
          cdkFocusInitial
        ></textarea>
        @if (reason.touched && reason.invalid) {
          <span class="hint warn">A reason is needed — it is kept with the record.</span>
        }
      </div>
    </div>
    @for (message of errors(); track $index) {
      <p class="form-error" role="alert">{{ message }}</p>
    }
  </div>
  <div class="form-foot">
    <button class="btn danger" type="submit" [disabled]="busy()">
      {{ busy() ? 'Working…' : data.confirmLabel }}
    </button>
    <button class="btn ghost" type="button" (click)="ref.close()">Cancel</button>
  </div>
</form>
