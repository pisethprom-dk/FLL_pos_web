<!-- v1.0.0 -->
<div class="pw-field">
  <ng-content />
  <button
    type="button"
    class="pw-toggle"
    aria-label="Show password"
    [attr.aria-pressed]="shown()"
    (click)="toggle()"
  >
    {{ shown() ? 'Hide' : 'Show' }}
  </button>
</div>
@if (capsLock()) {
  <span class="hint warn" role="status">Caps Lock is on.</span>
}
