# v1.0.0 — the Angular app at pos.bgs-badminton.store, on the EC2 that runs
# the backend. Its own site, beside the backend's: it serves the build from
# /var/www/pos-frontend and nothing else yet. Connecting /api/ and /media/ to
# Django is a later step (owner's choice, 2026-10-09), so until then the page
# loads but signing in fails.
#
# Plain HTTP on purpose: `sudo certbot --nginx -d pos.bgs-badminton.store`
# then adds HTTPS, the certificate and the http → https redirect to this file
# only, and renews by itself. Steps: deploy/README.md.
server {
    listen 80;
    listen [::]:80;
    server_name pos.bgs-badminton.store;

    root /var/www/pos-frontend;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Never cached, so the browser always asks for the newest build's file list.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Hashed by the build (main-…js, chunk-…js, styles-…css, fonts/…): a new
    # build gives new names, so these never change and are kept a year. A
    # missing one is a 404, never index.html.
    location ~* \.(?:js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Not connected yet: an API call is refused plainly (503), never answered
    # with the app's page. The API step replaces this with the proxy to Django.
    location /api/ {
        return 503;
    }

    # Any other path is a screen of the app, so it gets index.html and
    # Angular's router takes it from there.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
